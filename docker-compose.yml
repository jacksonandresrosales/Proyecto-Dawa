services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: servigest
      POSTGRES_PASSWORD: servigest
      POSTGRES_DB: servigest
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  # Base separada para pruebas de integración: se vacía en cada ejecución
  db_test:
    image: postgres:16
    environment:
      POSTGRES_USER: servigest
      POSTGRES_PASSWORD: servigest
      POSTGRES_DB: servigest_test
    ports:
      - "5433:5432"

volumes:
  db_data:
