openapi: 3.0.3
info:
  title: ServiGest API
  version: 1.0.0
  description: |
    API REST de ServiGest. Las rutas de la API usan el prefijo `/api`.
    Los errores tienen el formato `{ error: { code, message, details? } }`.
servers:
  - url: /api
    description: Servidor actual
security:
  - bearerAuth: []
tags:
  - name: Sistema
  - name: Autenticación
  - name: Usuarios
  - name: Clientes
  - name: Técnicos
  - name: Catálogos
  - name: Solicitudes
  - name: Notificaciones
  - name: Dashboard
paths:
  /health:
    get:
      tags: [Sistema]
      summary: Comprobar el estado del servicio y la base de datos
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Servicio y base de datos disponibles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Servicio disponible, pero sin conexión a la base de datos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /openapi.yaml:
    get:
      tags: [Sistema]
      summary: Obtener este contrato OpenAPI en YAML
      operationId: getOpenApiDocument
      security: []
      responses:
        '200':
          description: Documento OpenAPI
          content:
            text/yaml:
              schema:
                type: string
  /docs/:
    get:
      tags: [Sistema]
      summary: Interfaz interactiva Swagger UI
      operationId: getSwaggerUi
      security: []
      responses:
        '200':
          description: Página Swagger UI
          content:
            text/html:
              schema:
                type: string
  /auth/setup-status:
    get:
      tags: [Autenticación]
      summary: Consultar si falta crear el administrador inicial
      operationId: getSetupStatus
      security: []
      responses:
        '200':
          description: Estado de la configuración inicial
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupStatusResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/setup:
    post:
      tags: [Autenticación]
      summary: Crear el primer administrador e iniciar sesión
      operationId: createInitialAdmin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitialSetupRequest'
      responses:
        '201':
          description: Administrador creado y sesión iniciada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '404':
          description: Configuración inicial no disponible en producción
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimitError'
  /auth/login:
    post:
      tags: [Autenticación]
      summary: Iniciar sesión
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Sesión iniciada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '401':
          description: Credenciales inválidas o cuenta inactiva
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimitError'
  /auth/logout:
    post:
      tags: [Autenticación]
      summary: Cerrar la sesión local descartando el token
      operationId: logout
      responses:
        '204':
          description: Sesión cerrada
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /auth/me:
    get:
      tags: [Autenticación]
      summary: Obtener el perfil del usuario autenticado
      operationId: getMyProfile
      responses:
        '200':
          description: Perfil actual
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
    patch:
      tags: [Autenticación]
      summary: Actualizar el perfil o cambiar la contraseña
      operationId: updateMyProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdateRequest'
      responses:
        '200':
          description: Perfil actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          description: Datos inválidos o contraseña actual incorrecta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/forgot:
    post:
      tags: [Autenticación]
      summary: Solicitar restablecimiento de contraseña
      operationId: requestPasswordReset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: Respuesta neutra, exista o no el correo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimitError'
  /auth/reset:
    post:
      tags: [Autenticación]
      summary: Restablecer la contraseña usando un token
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Contraseña restablecida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '422':
          description: Token inválido, vencido o ya usado; o cuerpo inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /usuarios:
    get:
      tags: [Usuarios]
      summary: Listar usuarios
      operationId: listUsers
      description: Solo admin. Filtros admitidos `q`, `rol` y `activo`.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Active'
        - name: rol
          in: query
          schema:
            $ref: '#/components/schemas/UserRole'
      responses:
        '200':
          description: Página de usuarios
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiList'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [Usuarios]
      summary: Crear usuario administrador o coordinador
      operationId: createUser
      description: Solo admin. La contraseña temporal se muestra una sola vez en la respuesta.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '201':
          description: Usuario creado y contraseña temporal generada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedUserResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/ValidationError'
  /usuarios/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Usuarios]
      summary: Obtener usuario
      operationId: getUser
      description: Solo admin.
      responses:
        '200':
          description: Usuario
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/DataResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    patch:
      tags: [Usuarios]
      summary: Actualizar usuario
      operationId: updateUser
      description: Solo admin. No permite cambiar el rol de una cuenta vinculada a perfil cliente o técnico.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: Usuario actualizado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/DataResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Usuarios]
      summary: Desactivar usuario
      operationId: deactivateUser
      description: Solo admin. Es una baja lógica; no se elimina físicamente.
      responses:
        '204':
          description: Usuario desactivado
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/ValidationError'
  /usuarios/{id}/restablecer-password:
    post:
      tags: [Usuarios]
      summary: Generar contraseña temporal para un usuario
      operationId: resetUserPassword
      description: Solo admin. La contraseña temporal se muestra una sola vez.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Contraseña temporal generada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemporaryPasswordResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'
  /clientes:
    get:
      tags: [Clientes]
      summary: Listar clientes
      operationId: listClients
      description: Admin y coordinador. Filtros admitidos `q` y `activo`.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Active'
      responses:
        '200':
          description: Página de clientes
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiList'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Client'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [Clientes]
      summary: Crear cliente con usuario y sedes
      operationId: createClient
      description: Admin y coordinador. La respuesta incluye la contraseña temporal de un solo uso.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientCreateRequest'
      responses:
        '201':
          description: Cliente creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedClientResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/ValidationError'
  /clientes/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Clientes]
      summary: Obtener cliente
      operationId: getClient
      description: Admin y coordinador.
      responses:
        '200':
          description: Cliente y sus sedes vigentes
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/DataResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Client'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    patch:
      tags: [Clientes]
      summary: Actualizar cliente y opcionalmente sus sedes
      operationId: updateClient
      description: Admin y coordinador. Las sedes omitidas se desactivan.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientUpdateRequest'
      responses:
        '200':
          description: Cliente actualizado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/DataResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Client'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Clientes]
      summary: Eliminar cliente si no tiene sedes
      operationId: deleteClient
      description: Admin y coordinador. Si tiene sedes relacionadas responde 409 EN_USO; de lo contrario elimina cliente y usuario asociado.
      responses:
        '204':
          description: Cliente eliminado
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
  /clientes/{id}/sedes:
    get:
      tags: [Clientes]
      summary: Listar sedes vigentes de un cliente
      operationId: listClientSites
      description: Admin/coordinador pueden consultar cualquier cliente. El cliente solo puede consultar su propia organización.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Sedes activas, ordenadas por nombre
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/DataResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Site'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'
  /tecnicos:
    get:
      tags: [Técnicos]
      summary: Listar técnicos
      operationId: listTechnicians
      description: Admin y coordinador. Filtros admitidos `q` y `activo`.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Active'
      responses:
        '200':
          description: Página de técnicos
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiList'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Technician'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [Técnicos]
      summary: Crear técnico con especialidades
      operationId: createTechnician
      description: Admin y coordinador. La respuesta incluye la contraseña temporal de un solo uso.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TechnicianCreateRequest'
      responses:
        '201':
          description: Técnico creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedTechnicianResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/ValidationError'
  /tecnicos/carga:
    get:
      tags: [Técnicos]
      summary: Consultar carga actual de técnicos
      operationId: getTechnicianWorkload
      description: Admin y coordinador. Incluye solicitudes activas ordenadas por fecha límite.
      responses:
        '200':
          description: Carga por técnico
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/DataResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/TechnicianWorkload'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /tecnicos/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Técnicos]
      summary: Obtener técnico
      operationId: getTechnician
      description: Admin y coordinador.
      responses:
        '200':
          description: Técnico
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/DataResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Technician'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    patch:
      tags: [Técnicos]
      summary: Actualizar técnico
      operationId: updateTechnician
      description: Admin y coordinador.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TechnicianUpdateRequest'
      responses:
        '200':
          description: Técnico actualizado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/DataResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Technician'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Técnicos]
      summary: Eliminar técnico si no tiene especialidades
      operationId: deleteTechnician
      description: Admin y coordinador. Si tiene especialidades relacionadas responde 409 EN_USO.
      responses:
        '204':
          description: Técnico eliminado
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
  /especialidades:
    get:
      tags: [Catálogos]
      summary: Listar especialidades
      operationId: listSpecialties
      description: Admin y coordinador.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Active'
      responses:
        '200':
          description: Página de especialidades
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiList'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Specialty'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [Catálogos]
      summary: Crear especialidad
      operationId: createSpecialty
      description: Admin y coordinador.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpecialtyCreateRequest'
      responses:
        '201':
          description: Especialidad creada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/DataResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Specialty'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/ValidationError'
  /especialidades/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Catálogos]
      summary: Obtener especialidad
      operationId: getSpecialty
      description: Admin y coordinador.
      responses:
        '200':
          description: Especialidad
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/DataResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Specialty'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    patch:
      tags: [Catálogos]
      summary: Actualizar especialidad
      operationId: updateSpecialty
      description: Admin y coordinador.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpecialtyUpdateRequest'
      responses:
        '200':
          description: Especialidad actualizada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/DataResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Specialty'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Catálogos]
      summary: Eliminar especialidad si no tiene relaciones
      operationId: deleteSpecialty
      description: Admin y coordinador. Si está relacionada con técnicos o categorías responde 409 EN_USO.
      responses:
        '204':
          description: Especialidad eliminada
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
