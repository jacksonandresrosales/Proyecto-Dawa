<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <title>ServiGest</title>
    <!-- Tema oscuro según la preferencia del sistema (docs/ux/06-sistema-visual.md) -->
    <script>
      const oscuro = matchMedia("(prefers-color-scheme: dark)");
      const aplicar = () => document.documentElement.classList.toggle("dark", oscuro.matches);
      aplicar();
      oscuro.addEventListener("change", aplicar);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
