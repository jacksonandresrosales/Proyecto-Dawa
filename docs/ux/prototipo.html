<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ServiGest Prototipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Prototipo navegable de ServiGest. Consola sobria: menú lateral + contenido. Tokens de docs/ux/06-sistema-visual.md */
:root{
  --bg:#FBFBFB; --card:#FFFFFF; --fg:#333333; --muted:#777777; --soft:#F8F8F8; --hover:#F2F2F2;
  --border:#EDEDED; --line:#F3F3F3; --input:#E1E1E1; --primary:#2567FF; --primary-fg:#FFFFFF;
  --danger:#C4281C; --overlay:#00000059; --shadow:0 1px 3px #00000008; --shadow-lg:0 16px 48px #0000001F;
  --neutral:#636366; --neutral-bg:#F2F2F7; --neutral-dot:#AEAEB2;
  --warning:#8A5F00; --warning-bg:#FFF7E0; --warning-dot:#F2A900;
  --accent:#07479E; --accent-bg:#EAF1FF; --accent-dot:#2567FF;
  --info:#1B4FE0; --info-bg:#EAF1FF; --info-dot:#2567FF;
  --review:#9A5200; --review-bg:#FFF1DE; --review-dot:#FF9500;
  --success:#1B7A3A; --success-bg:#E7F7EC; --success-dot:#34C759;
  --dangert:#C4281C; --danger-bg:#FFEBE9; --danger-dot:#FF3B30;
  --critical:#D92D20; --on-critical:#FFFFFF;
  --sans:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono:"Geist Mono", ui-monospace, SFMono-Regular, Consolas, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E0E10; --card:#151517; --fg:#E8E8EA; --muted:#9A9AA2; --soft:#1C1C1F; --hover:#232327;
  --border:#2A2A2E; --line:#202024; --input:#34343A; --primary:#4073D4; --primary-fg:#FFFFFF;
  --danger:#FF7A70; --overlay:#000000A6; --shadow:none; --shadow-lg:0 16px 48px #00000080;
  --neutral:#A6A6AE; --neutral-bg:#FFFFFF12; --neutral-dot:#6B6B73;
  --warning:#F5C451; --warning-bg:#F5C4511F; --warning-dot:#F5C451;
  --accent:#8DB4FF; --accent-bg:#4D8BFF24; --accent-dot:#4D8BFF;
  --info:#8DB4FF; --info-bg:#4D8BFF29; --info-dot:#4D8BFF;
  --review:#FFB35C; --review-bg:#FF742624; --review-dot:#FF8A3D;
  --success:#5BD68F; --success-bg:#41D97F24; --success-dot:#41D97F;
  --dangert:#FF7A70; --danger-bg:#FF453A29; --danger-dot:#FF453A;
  --critical:#D34247; --on-critical:#FFFFFF; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E0E10; --card:#151517; --fg:#E8E8EA; --muted:#9A9AA2; --soft:#1C1C1F; --hover:#232327;
  --border:#2A2A2E; --line:#202024; --input:#34343A; --primary:#4073D4; --primary-fg:#FFFFFF;
  --danger:#FF7A70; --overlay:#000000A6; --shadow:none; --shadow-lg:0 16px 48px #00000080;
  --neutral:#A6A6AE; --neutral-bg:#FFFFFF12; --neutral-dot:#6B6B73;
  --warning:#F5C451; --warning-bg:#F5C4511F; --warning-dot:#F5C451;
  --accent:#8DB4FF; --accent-bg:#4D8BFF24; --accent-dot:#4D8BFF;
  --info:#8DB4FF; --info-bg:#4D8BFF29; --info-dot:#4D8BFF;
  --review:#FFB35C; --review-bg:#FF742624; --review-dot:#FF8A3D;
  --success:#5BD68F; --success-bg:#41D97F24; --success-dot:#41D97F;
  --dangert:#FF7A70; --danger-bg:#FF453A29; --danger-dot:#FF453A;
  --critical:#D34247; --on-critical:#FFFFFF; color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:13.5px;line-height:20px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
.i{fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.mono{font-family:var(--mono);font-size:12.5px}
.muted{color:var(--muted)}
.sub{color:var(--muted);font-size:13px}
.h1{margin:0;font-size:26px;line-height:32px;font-weight:500;text-wrap:balance}
.h2{margin:0;font-size:15px;line-height:20px;font-weight:600}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 14px;border-radius:9999px;border:0;font-weight:500;white-space:nowrap;background:transparent;text-decoration:none;transition:background .16s,opacity .16s}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-p{background:var(--primary);color:var(--primary-fg)}
.btn-p:hover:not(:disabled){filter:brightness(1.08)}
.btn-s{background:var(--card);color:var(--fg);border:1px solid var(--input)}
.btn-s:hover:not(:disabled){background:var(--hover)}
.btn-g{color:var(--muted)}
.btn-g:hover:not(:disabled){background:var(--hover);color:var(--fg)}
.btn-d{background:var(--danger);color:#FFFFFF}
.btn-dg{color:var(--danger)}
.btn-dg:hover{background:var(--danger-bg)}
.btn-lg{height:40px;padding:0 18px}
.btn-sm{height:28px;padding:0 12px;font-size:13px}
.ico{width:30px;height:30px;padding:0;border-radius:8px;position:relative}
.dash-btn{border-style:dashed;color:var(--muted)}
.badge{position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;padding:0 4px;border-radius:9999px;background:var(--primary);color:var(--primary-fg);font-size:11px;line-height:16px;text-align:center;box-sizing:border-box}

/* Campos */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.lbl{font-size:12px;line-height:16px;font-weight:500}
.lbl .opt{font-weight:400;color:var(--muted)}
.inp{height:32px;box-sizing:border-box;width:100%;border:1px solid var(--input);border-radius:10px;padding:0 12px;background:var(--card);color:var(--fg)}
textarea.inp{height:auto;min-height:88px;padding:8px 12px;resize:vertical}
.inp:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 20%,transparent)}
.inp[aria-invalid="true"]{border-color:var(--danger);box-shadow:0 0 0 3px color-mix(in srgb,var(--danger) 14%,transparent)}
.err{font-size:13px;color:var(--danger)}
.ayuda{font-size:13px;color:var(--muted)}
.search{position:relative;display:flex;align-items:center;flex:1 1 220px;max-width:320px}
.search .i{position:absolute;left:10px;color:var(--muted)}
.search .inp{padding-left:32px}
.chk{display:inline-flex;align-items:center;gap:8px;min-height:28px}
.chk input{width:16px;height:16px;accent-color:var(--primary)}

/* Píldoras de tono */
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 8px;border-radius:9999px;font-size:12px;line-height:16px;font-weight:500;white-space:nowrap}
.dot{width:6px;height:6px;border-radius:50%;flex:none}
.t-neutral{background:var(--neutral-bg);color:var(--neutral)} .t-neutral .dot{background:var(--neutral-dot)}
.t-warning{background:var(--warning-bg);color:var(--warning)} .t-warning .dot{background:var(--warning-dot)}
.t-accent{background:var(--accent-bg);color:var(--accent)} .t-accent .dot{background:var(--accent-dot)}
.t-info{background:var(--info-bg);color:var(--info)} .t-info .dot{background:var(--info-dot)}
.t-review{background:var(--review-bg);color:var(--review)} .t-review .dot{background:var(--review-dot)}
.t-success{background:var(--success-bg);color:var(--success)} .t-success .dot{background:var(--success-dot)}
.t-danger{background:var(--danger-bg);color:var(--dangert)} .t-danger .dot{background:var(--danger-dot)}
.t-critical{background:var(--critical);color:var(--on-critical)} .t-critical .dot{background:var(--on-critical)}

/* Tablas */
.tabla-caja{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;min-width:640px}
.tbl th{height:36px;padding:0 16px;text-align:left;font-size:12px;font-weight:500;color:var(--muted);border-bottom:1px solid var(--border);white-space:nowrap}
.tbl td{height:44px;padding:0 16px;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.clic{cursor:pointer}
.tbl tr.clic:hover td{background:var(--soft)}
.tbl tr.off td{color:var(--muted);background:var(--soft)}
.link{background:none;border:0;padding:0;color:var(--fg);font-weight:500}
.link:hover{color:var(--primary)}
a.a,button.a{color:var(--primary);background:none;border:0;padding:0;font-weight:500;text-decoration:none}

/* Login */
.login{min-height:100%;box-sizing:border-box;padding:32px 16px;display:grid;place-items:center}
.login-box{width:100%;max-width:400px;display:flex;flex-direction:column;gap:16px}
.login-card{padding:32px;display:flex;flex-direction:column;gap:20px}
.logo{width:40px;height:40px;border-radius:10px;background:var(--primary);color:var(--primary-fg);display:flex;align-items:center;justify-content:center;font-weight:600}
.alerta{display:flex;gap:8px;align-items:center;border-radius:10px;padding:8px 12px;font-size:13px}
.alerta.mal{background:var(--danger-bg);color:var(--dangert)}
.alerta.ok{background:var(--success-bg);color:var(--success)}
.alerta.info{background:var(--accent-bg);color:var(--accent)}
.demo{padding:16px;display:flex;flex-direction:column;gap:6px}
.demo-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 8px;border-radius:10px;border:0;background:transparent;text-align:left;width:100%}
.demo-row:hover{background:var(--hover)}

/* Estructura */
.app{display:flex;min-height:100%}
.nav{flex:none;width:240px;box-sizing:border-box;border-right:1px solid var(--border);padding:16px 10px;display:flex;flex-direction:column;gap:2px;background:var(--bg);position:sticky;top:0;height:100vh;overflow-y:auto}
.marca{display:flex;align-items:center;gap:8px;padding:0 8px 16px;font-weight:600;font-size:15px}
.marca .logo{width:28px;height:28px;border-radius:8px;font-size:12px}
.item{display:flex;align-items:center;gap:10px;height:32px;padding:0 8px;border-radius:8px;color:var(--muted);background:none;border:0;width:100%;text-align:left}
.item:hover{background:var(--hover);color:var(--fg)}
.item.on{background:var(--hover);color:var(--fg);font-weight:500}
.item.subi{padding-left:34px;font-size:13px}
.item .cnt{margin-left:auto;font-size:12px;color:var(--muted)}
.grupo{padding:12px 8px 4px;font-size:12px;color:var(--muted);font-weight:500}
.nav-pie{margin-top:auto;padding-top:12px;border-top:1px solid var(--border)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:56px;box-sizing:border-box;border-bottom:1px solid var(--border);padding:0 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;background:var(--bg);z-index:20}
.migas{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.migas b{color:var(--fg);font-weight:500}
.yo{display:flex;align-items:center;gap:8px;font-size:13px;border:0;background:none;padding:4px 6px;border-radius:9999px}
.yo:hover{background:var(--hover)}
.av{width:28px;height:28px;border-radius:50%;background:var(--accent-bg);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex:none}
.menu-yo{position:absolute;right:24px;top:52px;width:220px;padding:6px;display:flex;flex-direction:column;gap:2px;z-index:30;box-shadow:var(--shadow-lg)}
.cont{padding:24px;display:flex;flex-direction:column;gap:16px;box-sizing:border-box;width:100%;max-width:1280px}
.btn-menu{display:none}
.velo{display:none}

/* Bloques */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.kpi{padding:14px 16px;display:flex;flex-direction:column;gap:4px;text-align:left;color:var(--fg)}
button.kpi:hover{border-color:var(--input)}
.num{font-size:26px;line-height:32px;font-weight:500;font-variant-numeric:tabular-nums}
.cab{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px}
.dos{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:16px;align-items:start}
.tres{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.datos{margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.datos dt{font-size:12px;line-height:16px;font-weight:500;color:var(--muted)}
.datos dd{margin:0}
.caja-gris{background:var(--soft);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:4px}
.hist{margin:0;padding:0;list-style:none;display:flex;flex-direction:column}
.hist li{display:flex;gap:12px}
.hist .eje{flex:none;display:flex;flex-direction:column;align-items:center}
.hist .p{width:8px;height:8px;margin-top:6px;border-radius:50%;background:var(--neutral-dot)}
.hist li:first-child .p{background:var(--primary)}
.hist .l{flex:1;width:1px;background:var(--border);margin:4px 0}
.hist li:last-child .l{display:none}
.hist .c{display:flex;flex-direction:column;gap:2px;padding-bottom:16px;min-width:0}
.barra{height:8px;background:var(--hover);border-radius:9999px;overflow:hidden}
.barra>span{display:block;height:100%;border-radius:9999px}
.barras{display:flex;flex-direction:column;gap:8px}
.barras .fila{display:grid;grid-template-columns:120px minmax(0,1fr) 28px;align-items:center;gap:10px;font-size:13px}
.barras .fila>span:first-child{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barras .fila>span:last-child{text-align:right;font-weight:500;font-variant-numeric:tabular-nums}
.vacio{padding:40px 16px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.vacio .ic{width:40px;height:40px;border-radius:10px;background:var(--soft);color:var(--muted);display:flex;align-items:center;justify-content:center}
.pasos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.paso{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:10px;border:1px solid var(--input);background:var(--card);text-align:left;color:var(--fg)}
.paso.hecho{background:var(--soft);border-color:var(--border)}
.marca-paso{flex:none;width:18px;height:18px;margin-top:1px;border-radius:50%;border:1.5px solid var(--neutral-dot);box-sizing:border-box;display:flex;align-items:center;justify-content:center}
.paso.hecho .marca-paso{background:var(--success-dot);border-color:var(--success-dot);color:#FFFFFF}
.prog{height:6px;border-radius:9999px;background:var(--hover);overflow:hidden}
.prog>span{display:block;height:100%;background:var(--primary)}
.zona{border:1px dashed var(--input);border-radius:10px;background:var(--soft);padding:20px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.adj{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 10px;border:1px solid var(--border);border-radius:10px}
.noti{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left;color:var(--fg)}
.noti:last-child{border-bottom:0}
.noti:hover{background:var(--soft)}
.noti .p{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none;background:transparent}
.noti.nueva .p{background:var(--primary)}
.noti.nueva .t{font-weight:500}
.sw{position:relative;width:34px;height:20px;border-radius:9999px;border:0;background:var(--input);padding:0;flex:none;transition:background .16s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#FFFFFF;transition:transform .16s}
.sw[aria-checked="true"]{background:var(--primary)}
.sw[aria-checked="true"]::after{transform:translateX(14px)}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--sans)}
.leyenda{display:flex;gap:14px;color:var(--muted);font-size:13px}
.leyenda span{display:inline-flex;align-items:center;gap:6px}

/* Modal y avisos */
.modal-velo{position:fixed;inset:0;background:var(--overlay);display:flex;align-items:center;justify-content:center;padding:24px 16px;z-index:50;overflow-y:auto}
.modal{width:100%;max-width:480px;background:var(--card);border-radius:24px;padding:24px;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;gap:16px;box-sizing:border-box;max-height:100%;overflow-y:auto}
.modal.ancho{max-width:860px}
.modal-cab{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.modal-pie{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:9999px;font-weight:500;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:8px;max-width:calc(100% - 32px);box-sizing:border-box}
.clave{font-family:var(--mono);font-size:18px;padding:12px;border-radius:10px;background:var(--soft);text-align:center;letter-spacing:.04em;user-select:all}
.aviso{position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:70;width:min(560px,calc(100% - 32px));box-sizing:border-box;box-shadow:var(--shadow-lg);justify-content:space-between}
.alerta.adv{background:var(--warning-bg);color:var(--warning)}
.banda{display:flex;gap:8px;align-items:center;padding:8px 24px;font-size:13px;background:var(--warning-bg);color:var(--warning);border-bottom:1px solid var(--border)}
.esq{background:var(--hover);border-radius:8px;animation:pulso 1.2s ease-in-out infinite}
@keyframes pulso{50%{opacity:.5}}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border)}
.tab{height:36px;padding:0 12px;border:0;background:none;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:500}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--primary)}
.campana{position:absolute;right:72px;top:52px;width:340px;max-width:calc(100% - 32px);z-index:30;box-shadow:var(--shadow-lg);overflow:hidden}
.sim{position:fixed;left:16px;bottom:16px;z-index:65}
.sim-panel{position:absolute;left:0;bottom:40px;width:300px;padding:12px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow-lg)}
.sim-panel .btn{justify-content:flex-start}
.cnt-txt{font-size:12px;color:var(--muted);align-self:flex-end}

@media (max-width: 960px){
  .dos,.tres{grid-template-columns:minmax(0,1fr)}
  .pasos{grid-template-columns:minmax(0,1fr)}
}
@media (max-width: 860px){
  .nav{position:fixed;left:0;top:0;bottom:0;z-index:45;transform:translateX(-100%);transition:transform .2s;background:var(--card);padding-left:max(10px,env(safe-area-inset-left,0px))}
  .menu-on .nav{transform:none}
  .menu-on .velo{display:block;position:fixed;inset:0;background:var(--overlay);z-index:44}
  .btn-menu{display:inline-flex}
  .top{padding:0 16px}
  .cont{padding:16px}
  .yo .nom{display:none}
  .menu-yo{right:16px}
  .campana{right:16px}
  .banda{padding:8px 16px}
}
</style>

<div id="app"></div>
